<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - uMentorship</title>

    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="signup.css"/>
</head>
<body>
    <div class="top-bar">
        <a class="top-button" id="homepageButton" href="index.html">Home</a>
    </div>

    <main class="auth">
        <form id="signin-form" class="auth-card">
            <h1>Sign Up</h1>

            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="name" autocomplete="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>

            <button type="submit">Create account</button>
            <p id="message"></p>

            <p class="auth-link">Already have an account? <a href="signin.html">Sign In</a></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
