<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - uMentorship</title>

    <link rel="stylesheet" href="signup.css"/>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="common.css" />
</head>
<body>
    <header class="navbar">
      <a class="logo" href="index.html">uMentorship</a>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="students.html">Students</a></li>
          <li><a href="team.html">Team</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="pricing.html">Pricing</a></li>
          <li><a href="signin.html">Sign in</a></li>
          <li><a class="active" href="signup.html">Sign up</a></li>
        </ul>
      </nav>
    </header>

    <main class="auth">
          <form id="signup-form" class="auth-card">
        <h1>Sign Up</h1>

        <div class="role">
            <input type="radio" id="student" name="role" value="Student" checked>
            <label for="student">Student</label>
            <input type="radio" id="mentor" name="role" value="Mentor">
            <label for="mentor">Mentor</label>
        </div>

        <label for="user">Username</label>
        <input type="text" id="user" name="user" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>

        <button type="submit">Create account</button>
        <p id="message"></p>

        <p class="auth-link">Already have an account? <a href="signin.html">Sign In</a></p>
    </form>
    </main>

    <footer>
      <div class="social-links">
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin"></i></a>
      </div>
      <p>
        Contact us:
        <a href="mailto:contact@umentorship.ca">contact@umentorship.ca</a>
      </p>
      <p>&copy; 2026 uMentorship. All rights reserved.</p>
    </footer>

    <script src="signup.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
