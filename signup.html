<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - uMentorship</title>

    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="signup.css"/>
</head>
<body>
    <div class="top-bar">
        <a class="top-button" id="homepageButton" href="index.html">Home</a>
    </div>

    <main class="auth">
          <form id="signup-form" class="auth-card">
        <h1>Sign Up</h1>

        <div class="role">
            <input type="radio" id="student" name="role" value="Student" checked>
            <label for="student">Student</label>
            <input type="radio" id="mentor" name="role" value="Mentor">
            <label for="mentor">Mentor</label>
        </div>

        <label for="user">Username</label>
        <input type="text" id="user" name="user" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>

        <button type="submit">Create account</button>
        <p id="message"></p>

        <p class="auth-link">Already have an account? <a href="signin.html">Sign In</a></p>
    </form>
    </main>

    <script src="signup.js"></script>
</body>
</html>
